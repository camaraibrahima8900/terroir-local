<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur - Terroir Local</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
<div class="min-vh-100 d-flex align-items-center justify-content-center" style="background:linear-gradient(135deg,#f5f7fa,#e8f5e9)">
    <div class="text-center p-5">
        <div style="font-size:5rem">⚠️</div>
        <h1 class="text-danger fw-bold mt-3">Oops !</h1>
        <p class="text-muted fs-5 mt-2">{{ message }}</p>
        <div class="d-flex gap-3 justify-content-center mt-4">
            <a href="/" class="btn btn-success rounded-3 px-4">
                <i class="fas fa-home me-2"></i>Accueil
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-success rounded-3 px-4">
                <i class="fas fa-arrow-left me-2"></i>Retour
            </a>
        </div>
    </div>
</div>
</body>
</html>

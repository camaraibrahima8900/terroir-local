<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Terroir Local Senegal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
<div class="login-container">
    <div class="login-card animate-in">
        <div class="login-logo">🌿</div>
        <div class="login-title">Terroir Local Senegal</div>
        <div class="login-subtitle">Plateforme Agricole Senegalaise</div>

        {% if erreur %}
        <div class="alert alert-danger rounded-3 py-2">
            <i class="fas fa-exclamation-circle me-2"></i>{{ erreur }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold text-dark">
                    <i class="fas fa-user text-success me-2"></i>Nom utilisateur
                </label>
                <input type="text" name="username" class="form-control form-control-lg rounded-3"
                       placeholder="Entrez votre nom" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold text-dark">
                    <i class="fas fa-lock text-success me-2"></i>Mot de passe
                </label>
                <input type="password" name="password" class="form-control form-control-lg rounded-3"
                       placeholder="Entrez votre mot de passe" required>
            </div>
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt me-2"></i>Se connecter
            </button>
        </form>

        <div class="text-center mt-4">
            <small class="text-muted">
                <i class="fas fa-leaf text-success me-1"></i>
                Terroir Local Senegal &copy; 2025
            </small>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
